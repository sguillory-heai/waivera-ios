# XcodeGen spec. The .xcodeproj is generated (`xcodegen generate`) and not committed,
# so project changes review as plain YAML and never merge-conflict.
name: Waivera
options:
  bundleIdPrefix: com.waivera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WaiveraAPI:
    path: Packages/WaiveraAPI
  WaiveraRealtime:
    path: Packages/WaiveraRealtime
  WaiveraDesign:
    path: Packages/WaiveraDesign
  WaiveraRouting:
    path: Packages/WaiveraRouting
  WaiveraNotifications:
    path: Packages/WaiveraNotifications
  Features:
    path: Packages/Features
  # Messaging only (the FirebaseMessaging product); Auth goes over REST inside WaiveraAPI.
  # Needed to receive FCM tokens for APNs, which sprout_api sends through (ADR 0003).
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 11.15.0
  # Component snapshot tests only; never linked into the app.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.18.3

targets:
  Waivera:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    dependencies:
      - package: WaiveraAPI
      - package: WaiveraRealtime
      - package: WaiveraDesign
        product: WaiveraDesign
      - package: WaiveraRouting
      - package: WaiveraNotifications
        product: WaiveraNotifications
      - package: WaiveraNotifications
        product: WaiveraNotificationsLive
      - package: Features
        product: AuthFeature
      - package: Features
        product: TodayFeature
      - package: Features
        product: ChatFeature
      - package: Features
        product: ScheduleFeature
      - package: Features
        product: ProfileFeature
      - package: Features
        product: SettingsFeature
      - package: Firebase
        product: FirebaseMessaging
    info:
      path: App/Info.plist
      properties:
        # Push arrives as alerts; remote-notification lets the app refresh unread state on delivery.
        UIBackgroundModes: [remote-notification]
        # The app hands the APNs token to FCM itself (FirebaseBootstrap), so no method swizzling.
        FirebaseAppDelegateProxyEnabled: false
        CFBundleURLTypes:
          - CFBundleURLName: com.waivera.waivera
            CFBundleURLSchemes: [waivera]
        # Read by WaiveraConfiguration / AppConfiguration. Values come from Config/*.xcconfig.
        WaiveraAPIBaseURL: $(WAIVERA_API_BASE_URL)
        WaiveraWebBaseURL: $(WAIVERA_WEB_BASE_URL)
        WaiveraFirebaseAPIKey: $(WAIVERA_FIREBASE_API_KEY)
        WaiveraFirebaseAppID: $(WAIVERA_FIREBASE_APP_ID)
        WaiveraFirebaseSenderID: $(WAIVERA_FIREBASE_SENDER_ID)
        WaiveraFirebaseProjectID: $(WAIVERA_FIREBASE_PROJECT_ID)
        # No NSAppTransportSecurity exceptions: every environment is HTTPS.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waivera.waivera
        PRODUCT_NAME: Waivera
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Waivera
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Push needs the aps-environment entitlement. It is not added yet: entitlements change only
        # with approval and need Apple Developer account access (AGENTS.md safety rules).

  WaiveraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WaiveraUITests
    dependencies:
      - target: Waivera
      - package: WaiveraRouting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waivera.waivera.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Waivera
        CODE_SIGN_STYLE: Automatic

  # Design-system component snapshots (light, dark, accessibility XXXL). Not hosted in the app,
  # so no app launch, network or push setup runs during these tests.
  WaiveraSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WaiveraSnapshotTests
    dependencies:
      - package: WaiveraDesign
        product: WaiveraDesign
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waivera.waivera.snapshottests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  Waivera:
    build:
      targets:
        Waivera: all
        WaiveraUITests: [test]
        WaiveraSnapshotTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - WaiveraUITests
        - WaiveraSnapshotTests
        - package: WaiveraAPI/WaiveraAPITests
        - package: WaiveraRealtime/WaiveraRealtimeTests
        - package: WaiveraDesign/WaiveraDesignTokensTests
        - package: WaiveraRouting/WaiveraRoutingTests
        - package: WaiveraNotifications/WaiveraNotificationsTests
