# XcodeGen spec. The .xcodeproj is generated (`xcodegen generate`) and not committed,
# so project changes review as plain YAML and never merge-conflict.
name: Waivera
options:
  bundleIdPrefix: com.waivera
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  WaiveraAPI:
    path: Packages/WaiveraAPI
  WaiveraRealtime:
    path: Packages/WaiveraRealtime
  WaiveraDesign:
    path: Packages/WaiveraDesign

targets:
  Waivera:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: WaiveraAPI
      - package: WaiveraRealtime
      - package: WaiveraDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waivera.waivera
        PRODUCT_NAME: Waivera
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Waivera
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  WaiveraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - WaiveraUITests
    dependencies:
      - target: Waivera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waivera.waivera.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Waivera
        CODE_SIGN_STYLE: Automatic

schemes:
  Waivera:
    build:
      targets:
        Waivera: all
        WaiveraUITests: [test]
    test:
      gatherCoverageData: true
      targets:
        - WaiveraUITests
        - package: WaiveraAPI/WaiveraAPITests
        - package: WaiveraRealtime/WaiveraRealtimeTests
