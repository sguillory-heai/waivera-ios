name: iOS

# Manual only: Actions minutes are limited (macOS bills at 10x), so runs are started on
# purpose after local verification. One run collects every failure: each check is its own
# step with continue-on-error, everything is uploaded, and the last step fails the job and
# lists what failed.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full: lint, tests and screenshot tours. device: an unsigned iPhone .ipa to sideload. testflight: sign and upload to TestFlight."
        type: choice
        options: [full, device, testflight]
        default: full
      version:
        description: "testflight only: the version testers see (CFBundleShortVersionString). Empty keeps project.yml's."
        type: string
        default: ""

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Foundation-only packages on Linux: cheap, and covers parsing, routing, token logic, the data
  # layer and the fake environment. Apple-only files in them are behind #if canImport(...).
  packages-linux:
    if: inputs.mode == 'full'
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: Packages/*/.build
          key: spm-linux-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
      - name: Test WaiveraAPI
        id: api
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraAPI
      - name: Test WaiveraRealtime
        id: realtime
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraRealtime
      - name: Build WaiveraFixtures
        id: fixtures
        continue-on-error: true
        run: swift build --package-path Packages/WaiveraFixtures
      - name: Test WaiveraData
        id: data
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraData
      - name: Test WaiveraTestSupport
        id: testsupport
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraTestSupport
      - name: Test WaiveraDesign tokens
        id: design
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraDesign
      - name: Test WaiveraRouting
        id: routing
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraRouting
      - name: Test WaiveraNotifications
        id: notifications
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraNotifications
      # Feature models, rules and formatters; every SwiftUI file is behind #if canImport(UIKit).
      - name: Test Features
        id: features
        continue-on-error: true
        run: swift test --package-path Packages/Features
      - name: Fail if any package failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.api.outcome }}" = success ] || failed="$failed WaiveraAPI"
          [ "${{ steps.realtime.outcome }}" = success ] || failed="$failed WaiveraRealtime"
          [ "${{ steps.fixtures.outcome }}" = success ] || failed="$failed WaiveraFixtures"
          [ "${{ steps.data.outcome }}" = success ] || failed="$failed WaiveraData"
          [ "${{ steps.testsupport.outcome }}" = success ] || failed="$failed WaiveraTestSupport"
          [ "${{ steps.design.outcome }}" = success ] || failed="$failed WaiveraDesign"
          [ "${{ steps.routing.outcome }}" = success ] || failed="$failed WaiveraRouting"
          [ "${{ steps.notifications.outcome }}" = success ] || failed="$failed WaiveraNotifications"
          [ "${{ steps.features.outcome }}" = success ] || failed="$failed Features"
          if [ -n "$failed" ]; then echo "Failed packages:$failed"; exit 1; fi

  # macos-26 (generally available since Feb 2026) ships Xcode 26.x; Firebase 13.1.1 needs 26.2 or
  # later. Xcode is pinned rather than latest-stable so a runner image update cannot change the
  # compiler between two runs of the same commit; 26.6 is the image default since July 2026.
  app-macos:
    if: inputs.mode == 'full'
    runs-on: macos-26
    # Write access only to force-push the screenshots branch (last steps); nothing else pushes.
    permissions:
      contents: write
    # Run 41381753860: setup 4 minutes, build 14, shell tests 4, small-phone UI tests over 45,
    # publishing 3. Worst case with every step at its limit: setup 5, build 25, shell tests 12,
    # small phone 55, large phone 24, export and publish 5 = 126, plus 4 for the untimed steps.
    # The test steps stop themselves before their limits (stop-at-minutes.sh) so their result
    # bundles still close.
    timeout-minutes: 130
    env:
      DERIVED: DerivedData
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: SwiftLint
        id: swiftlint
        continue-on-error: true
        run: |
          set -o pipefail
          swiftlint --strict --reporter github-actions-logging 2>&1 | tee swiftlint.log
      - name: swift-format
        id: swiftformat
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun swift-format lint --strict -r App Packages WaiveraTests WaiveraUITests WaiveraSnapshotTests 2>&1 \
            | tee swift-format.log
      - name: Generate project
        id: xcodegen
        continue-on-error: true
        run: xcodegen generate
      # Restore and save are separate steps: the combined action saves only when the whole job
      # passes, so a run with any failing test never kept its packages (run 41381753860).
      - name: Restore SwiftPM cache
        id: spm_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DERIVED }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          # The generated project's Package.resolved is not committed; direct dependencies are
          # pinned with exactVersion in project.yml, so the manifests identify the resolution.
          key: spm-macos-${{ hashFiles('project.yml', 'Packages/*/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-macos-
      # The small phone is an iPhone SE (created when the image has the type but no device), the
      # large one a Pro Max. Both names are printed so the screenshots can be traced to a device.
      - name: Pick simulators
        id: sim
        continue-on-error: true
        run: |
          pick() {
            xcrun simctl list devices available -j | jq -r --arg re "$1" '
              [.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
               | select(.name | test($re))] | last | .udid // empty'
          }
          runtime=$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier // empty')
          small=$(pick '^iPhone SE')
          if [ -z "$small" ] && [ -n "$runtime" ]; then
            small=$(xcrun simctl create "iPhone SE (3rd generation)" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime" 2>/dev/null || true)
          fi
          large=$(pick 'Pro Max$')
          [ -n "$small" ] || small=$(pick '^iPhone')
          [ -n "$large" ] || large=$(pick '^iPhone')
          test -n "$small" && test -n "$large"
          xcrun simctl list devices | grep -E "$small|$large"
          echo "small=$small" >> "$GITHUB_OUTPUT"
          echo "large=$large" >> "$GITHUB_OUTPUT"
          # Boot the small phone now so its boot time is not charged to the first test.
          xcrun simctl boot "$small" || true
          xcrun simctl bootstatus "$small" -b
      # One build for both destinations, then tests run from the built products (no rebuild).
      # Keep building past errors so one run reports every module.
      - name: Build for testing
        id: build
        continue-on-error: true
        timeout-minutes: 25
        run: |
          status=0
          xcodebuild build-for-testing \
            -project Waivera.xcodeproj -scheme Waivera \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "error:|warning:" build.log | sort -u | head -300 || true
          tail -30 build.log
          exit $status
      - name: Save SwiftPM cache
        if: steps.build.outcome == 'success' && steps.spm_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DERIVED }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ steps.spm_cache.outputs.cache-primary-key }}
      # Package tests already ran on Linux; macOS runs only what needs a simulator. Tests run one
      # device at a time, without parallel clones (the runner has 3 cores), each step with its
      # own result bundle so a stuck step cannot take the others' results with it. The UI steps
      # interrupt xcodebuild a few minutes before their limit so their bundles still close.
      # Every test's pass/fail line streams to this log as it finishes.
      #
      # Component and screen snapshots are drawn at a fixed iPhone SE width and @2x, so they run
      # on the small phone only. A missing reference is recorded and fails that test once (first
      # recording); the recorded PNGs are uploaded below.
      - name: Shell tests and snapshots (small phone)
        id: unit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set +e
          .github/scripts/stop-at-minutes.sh 8 Unit.xcresult &
          watchdog=$!
          xcodebuild test-without-building \
            -project Waivera.xcodeproj -scheme Waivera \
            -destination "id=${{ steps.sim.outputs.small }}" \
            -derivedDataPath "$DERIVED" \
            -only-testing:WaiveraTests -only-testing:WaiveraSnapshotTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            -resultBundlePath Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee unit.log \
            | grep --line-buffered -iE "test case .*(passed|failed|skipped)|recorded|error:|\*\* TEST"
          status=${PIPESTATUS[0]}
          pkill -P "$watchdog" 2>/dev/null; kill "$watchdog" 2>/dev/null
          exit $status
      - name: UI tests, screenshot tour and accessibility audits (small phone)
        id: ui_small
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 55
        run: |
          set +e
          .github/scripts/stop-at-minutes.sh 50 UISmall.xcresult &
          watchdog=$!
          xcodebuild test-without-building \
            -project Waivera.xcodeproj -scheme Waivera \
            -destination "id=${{ steps.sim.outputs.small }}" \
            -derivedDataPath "$DERIVED" \
            -only-testing:WaiveraUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 \
            -resultBundlePath UISmall.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-small.log \
            | grep --line-buffered -iE "test case .*(passed|failed|skipped)|error:|^AUDIT |\*\* TEST"
          status=${PIPESTATUS[0]}
          pkill -P "$watchdog" 2>/dev/null; kill "$watchdog" 2>/dev/null
          exit $status
      # Screenshots only, light only: dark and the largest text are toured (and audited) on the
      # small phone, where they are hardest. Three tours here took over 30 minutes (run
      # 41381753860). TEST_RUNNER_ variables reach the test runner without the prefix. One light
      # tour was stopped at 14 minutes in testSlowStates in run 41533860726, so it gets 20 (step 24).
      - name: Screenshot tour (large phone)
        id: ui_large
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 24
        env:
          TEST_RUNNER_WAIVERA_AUDIT: "0"
        run: |
          set +e
          xcrun simctl shutdown "${{ steps.sim.outputs.small }}" || true
          .github/scripts/stop-at-minutes.sh 20 UILarge.xcresult &
          watchdog=$!
          xcodebuild test-without-building \
            -project Waivera.xcodeproj -scheme Waivera \
            -destination "id=${{ steps.sim.outputs.large }}" \
            -derivedDataPath "$DERIVED" \
            -only-testing:WaiveraUITests/ScreenshotTourLight \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 \
            -resultBundlePath UILarge.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-large.log \
            | grep --line-buffered -iE "test case .*(passed|failed|skipped)|error:|\*\* TEST"
          status=${PIPESTATUS[0]}
          pkill -P "$watchdog" 2>/dev/null; kill "$watchdog" 2>/dev/null
          exit $status
      - name: Export screenshots to PNG
        id: export
        if: always()
        continue-on-error: true
        run: |
          mkdir -p screenshots
          exported=0
          for bundle in Unit UISmall UILarge; do
            if [ ! -f "$bundle.xcresult/Info.plist" ]; then
              echo "$bundle.xcresult is missing or was not closed; nothing to export"
              continue
            fi
            out="screenshots/$bundle"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "$bundle.xcresult" --output-path "$out" || continue
            exported=1
            # Rename exported files to their attachment names (<route>__<device>-<variant>).
            if [ -f "$out/manifest.json" ]; then
              jq -r '.[] | .attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' \
                "$out/manifest.json" | while IFS=$'\t' read -r file name; do
                  [ -f "$out/$file" ] && mv "$out/$file" "$out/${name}" || true
                done
            fi
            echo "$bundle: $(find "$out" -name '*.png' | wc -l | tr -d ' ') PNGs"
          done
          test "$exported" = 1
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - name: Upload recorded component snapshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: snapshots
          path: WaiveraSnapshotTests/__Snapshots__
          if-no-files-found: ignore
      # Logs only: the result bundles (videos included) took over 5 minutes to upload, and their
      # screenshots and audit reports are exported above.
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: logs
          path: "*.log"
          if-no-files-found: warn
      # Artifacts download from a blob storage host that some review environments cannot reach;
      # a branch in this repo can be fetched anywhere the code can. Each run replaces the branch
      # with one orphan commit (latest run only, so it never grows): the exported screenshots
      # and audit reports, the recorded snapshots, and the test logs.
      #   git fetch origin ci-screenshots && git worktree add ../ci-screenshots FETCH_HEAD
      - name: Publish screenshots to the ci-screenshots branch
        id: publish
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(mktemp -d)
          # Pictures and audit reports only; failure recordings (video) would bloat the branch.
          if [ -d screenshots ]; then
            (cd screenshots && find . -type f \( -name '*.png' -o -name '*.txt' -o -name 'manifest.json' \) -print0 \
              | while IFS= read -r -d '' f; do
                  mkdir -p "$out/screenshots/$(dirname "$f")"
                  cp "$f" "$out/screenshots/$f"
                done)
          fi
          if [ -d WaiveraSnapshotTests/__Snapshots__ ]; then
            mkdir -p "$out/snapshots"
            cp -R WaiveraSnapshotTests/__Snapshots__/. "$out/snapshots/"
          fi
          mkdir -p "$out/logs"
          for f in unit.log ui-small.log ui-large.log swiftlint.log swift-format.log; do
            [ -f "$f" ] && cp "$f" "$out/logs/"
          done
          [ -f build.log ] && { grep -E "error:|warning:" build.log | sort -u > "$out/logs/build-diagnostics.log" || true; }
          {
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT)"
            echo "commit: $GITHUB_SHA"
            echo "branch: $GITHUB_REF_NAME"
            echo "small phone: ${{ steps.sim.outputs.small }}"
            echo "large phone: ${{ steps.sim.outputs.large }}"
            echo "outcomes: unit=${{ steps.unit.outcome }} ui_small=${{ steps.ui_small.outcome }} ui_large=${{ steps.ui_large.outcome }}"
          } > "$out/RUN.txt"
          cd "$out"
          git init -q -b ci-screenshots
          git add -A
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots from run $GITHUB_RUN_ID at ${GITHUB_SHA:0:7}"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" \
            push --force "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" HEAD:refs/heads/ci-screenshots
          echo "Published $(find . -name '*.png' -not -path './.git/*' | wc -l | tr -d ' ') PNGs to ci-screenshots"
      - name: Fail if any check failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.swiftlint.outcome }}" = success ] || failed="$failed swiftlint"
          [ "${{ steps.swiftformat.outcome }}" = success ] || failed="$failed swift-format"
          [ "${{ steps.xcodegen.outcome }}" = success ] || failed="$failed xcodegen"
          [ "${{ steps.sim.outcome }}" = success ] || failed="$failed simulators"
          [ "${{ steps.build.outcome }}" = success ] || failed="$failed build"
          [ "${{ steps.unit.outcome }}" = success ] || failed="$failed shell-tests-and-snapshots"
          [ "${{ steps.ui_small.outcome }}" = success ] || failed="$failed ui-tests-small-phone"
          [ "${{ steps.ui_large.outcome }}" = success ] || failed="$failed screenshot-tour-large-phone"
          [ "${{ steps.export.outcome }}" = success ] || failed="$failed screenshot-export"
          [ "${{ steps.publish.outcome }}" = success ] || failed="$failed screenshot-branch"
          if [ -n "$failed" ]; then echo "Failed checks:$failed"; exit 1; fi
          echo "All checks passed"

  # A Release build for a real iPhone, with no lint, tests or tours.
  # - device: unsigned; sideloading tools (Sideloadly, AltStore) sign it with the tester's own
  #   Apple ID on their computer.
  # - testflight: signed in the cloud with an App Store Connect API key (Xcode-managed
  #   certificates and profiles, nothing stored here) and uploaded to TestFlight. The archive
  #   signs for distribution directly: a development profile needs a registered device, and
  #   the team has none (run 41580293843). The build
  #   number is the UTC date and time, so every upload is higher than the last.
  # Prod values come from repository secrets into the git-ignored Config/Local.Release.xcconfig.
  # Push stays off: no aps-environment entitlement, and Firebase Messaging is configured only
  # when all four Firebase values exist.
  device:
    if: inputs.mode == 'device' || inputs.mode == 'testflight'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DERIVED: DerivedData
      ARCHIVE: ${{ github.workspace }}/build/Waivera.xcarchive
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install tools
        run: brew install xcodegen
      - name: Write the Release configuration from secrets
        env:
          API_BASE_URL: ${{ secrets.WAIVERA_API_BASE_URL }}
          WEB_BASE_URL: ${{ secrets.WAIVERA_WEB_BASE_URL }}
          FIREBASE_API_KEY: ${{ secrets.WAIVERA_FIREBASE_API_KEY }}
        run: |
          missing=""
          [ -n "$API_BASE_URL" ] || missing="$missing WAIVERA_API_BASE_URL"
          [ -n "$WEB_BASE_URL" ] || missing="$missing WAIVERA_WEB_BASE_URL"
          [ -n "$FIREBASE_API_KEY" ] || missing="$missing WAIVERA_FIREBASE_API_KEY"
          if [ -n "$missing" ]; then echo "Missing repository secrets:$missing"; exit 1; fi
          # xcconfig reads // as a comment, so https:// is written https:/$()/
          xc_url() { printf '%s' "$1" | sed 's|//|/$()/|'; }
          {
            echo "WAIVERA_API_BASE_URL = $(xc_url "$API_BASE_URL")"
            echo "WAIVERA_WEB_BASE_URL = $(xc_url "$WEB_BASE_URL")"
            echo "WAIVERA_FIREBASE_API_KEY = $FIREBASE_API_KEY"
          } > Config/Local.Release.xcconfig
      - name: Write the App Store Connect key
        if: inputs.mode == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$APPLE_TEAM_ID" ] || missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then echo "Missing repository secrets:$missing"; exit 1; fi
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$key"
          chmod 600 "$key"
          {
            echo "ASC_KEY_PATH=$key"
            echo "BUILD_NUMBER=$(date -u +%y%m%d).$(date -u +%H%M)"
          } >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" \
            -c "Add :destination string upload" \
            -c "Add :signingStyle string automatic" \
            -c "Add :teamID string $APPLE_TEAM_ID" \
            -c "Add :uploadSymbols bool true" \
            -c "Add :manageAppVersionAndBuildNumber bool false" \
            "$RUNNER_TEMP/ExportOptions.plist"
      - name: Generate project
        run: xcodegen generate
      - name: Restore SwiftPM cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DERIVED }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-macos-${{ hashFiles('project.yml', 'Packages/*/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-macos-
      - name: Build for iPhone (unsigned Release)
        if: inputs.mode == 'device'
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild build \
            -project Waivera.xcodeproj -scheme Waivera -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 \
            | tee device-build.log | grep -E "error:|\*\* BUILD" || true
          test -d "$DERIVED/Build/Products/Release-iphoneos/Waivera.app"
      - name: Package the .ipa
        if: inputs.mode == 'device'
        run: |
          mkdir Payload
          cp -R "$DERIVED/Build/Products/Release-iphoneos/Waivera.app" Payload/
          zip -qry "Waivera-${GITHUB_SHA::7}-unsigned.ipa" Payload
          ls -lh ./*.ipa
      - name: Upload the .ipa
        if: inputs.mode == 'device'
        uses: actions/upload-artifact@v5
        with:
          name: waivera-ios-unsigned-ipa
          path: "*.ipa"
          retention-days: 14
          if-no-files-found: error
      - name: Archive (signed Release)
        if: inputs.mode == 'testflight'
        timeout-minutes: 30
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          set -o pipefail
          version_setting=()
          [ -z "$VERSION" ] || version_setting=("MARKETING_VERSION=$VERSION")
          echo "Build number $BUILD_NUMBER ${VERSION:+version $VERSION}"
          xcodebuild archive \
            -project Waivera.xcodeproj -scheme Waivera -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" "${version_setting[@]}" 2>&1 \
            | tee device-build.log | grep -E "error:|\*\* ARCHIVE" || true
          test -d "$ARCHIVE"
      - name: Upload to TestFlight
        if: inputs.mode == 'testflight'
        timeout-minutes: 20
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tee upload.log | tail -40
      - name: Remove the keys and configuration
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" Config/Local.Release.xcconfig
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: device-logs
          path: |
            device-build.log
            upload.log
          if-no-files-found: ignore
