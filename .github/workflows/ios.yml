name: iOS

# Manual only: Actions minutes are limited (macOS bills at 10x), so runs are started on
# purpose after local verification. One run collects every failure: each check is its own
# step with continue-on-error, everything is uploaded, and the last step fails the job and
# lists what failed.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Foundation-only packages on Linux: cheap, and covers parsing, routing, token logic, the data
  # layer and the fake environment. Apple-only files in them are behind #if canImport(...).
  packages-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: Packages/*/.build
          key: spm-linux-${{ hashFiles('Packages/*/Package.swift', 'Packages/*/Package.resolved') }}
      - name: Test WaiveraAPI
        id: api
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraAPI
      - name: Test WaiveraRealtime
        id: realtime
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraRealtime
      - name: Build WaiveraFixtures
        id: fixtures
        continue-on-error: true
        run: swift build --package-path Packages/WaiveraFixtures
      - name: Test WaiveraData
        id: data
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraData
      - name: Test WaiveraTestSupport
        id: testsupport
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraTestSupport
      - name: Test WaiveraDesign tokens
        id: design
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraDesign
      - name: Test WaiveraRouting
        id: routing
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraRouting
      - name: Test WaiveraNotifications
        id: notifications
        continue-on-error: true
        run: swift test --package-path Packages/WaiveraNotifications
      # Feature models, rules and formatters; every SwiftUI file is behind #if canImport(UIKit).
      - name: Test Features
        id: features
        continue-on-error: true
        run: swift test --package-path Packages/Features
      - name: Fail if any package failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.api.outcome }}" = success ] || failed="$failed WaiveraAPI"
          [ "${{ steps.realtime.outcome }}" = success ] || failed="$failed WaiveraRealtime"
          [ "${{ steps.fixtures.outcome }}" = success ] || failed="$failed WaiveraFixtures"
          [ "${{ steps.data.outcome }}" = success ] || failed="$failed WaiveraData"
          [ "${{ steps.testsupport.outcome }}" = success ] || failed="$failed WaiveraTestSupport"
          [ "${{ steps.design.outcome }}" = success ] || failed="$failed WaiveraDesign"
          [ "${{ steps.routing.outcome }}" = success ] || failed="$failed WaiveraRouting"
          [ "${{ steps.notifications.outcome }}" = success ] || failed="$failed WaiveraNotifications"
          [ "${{ steps.features.outcome }}" = success ] || failed="$failed Features"
          if [ -n "$failed" ]; then echo "Failed packages:$failed"; exit 1; fi

  # macos-26 (generally available since Feb 2026) ships Xcode 26.x; Firebase 13.1.1 needs 26.2 or
  # later. Xcode is pinned rather than latest-stable so a runner image update cannot change the
  # compiler between two runs of the same commit; 26.6 is the image default since July 2026.
  app-macos:
    runs-on: macos-26
    # Build about 10 minutes, tests about 35 when nothing hangs; the step limits add up to 95.
    timeout-minutes: 110
    env:
      DERIVED: DerivedData
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: SwiftLint
        id: swiftlint
        continue-on-error: true
        run: |
          set -o pipefail
          swiftlint --strict --reporter github-actions-logging 2>&1 | tee swiftlint.log
      - name: swift-format
        id: swiftformat
        continue-on-error: true
        run: |
          set -o pipefail
          xcrun swift-format lint --strict -r App Packages WaiveraTests WaiveraUITests WaiveraSnapshotTests 2>&1 \
            | tee swift-format.log
      - name: Generate project
        id: xcodegen
        continue-on-error: true
        run: xcodegen generate
      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.DERIVED }}/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          # The generated project's Package.resolved is not committed; direct dependencies are
          # pinned with exactVersion in project.yml, so the manifests identify the resolution.
          key: spm-macos-${{ hashFiles('project.yml', 'Packages/*/Package.swift', '**/Package.resolved') }}
          restore-keys: spm-macos-
      # The small phone is an iPhone SE (created when the image has the type but no device), the
      # large one a Pro Max. Both names are printed so the screenshots can be traced to a device.
      - name: Pick simulators
        id: sim
        continue-on-error: true
        run: |
          pick() {
            xcrun simctl list devices available -j | jq -r --arg re "$1" '
              [.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
               | select(.name | test($re))] | last | .udid // empty'
          }
          runtime=$(xcrun simctl list runtimes available -j \
            | jq -r '[.runtimes[] | select(.platform == "iOS")] | last | .identifier // empty')
          small=$(pick '^iPhone SE')
          if [ -z "$small" ] && [ -n "$runtime" ]; then
            small=$(xcrun simctl create "iPhone SE (3rd generation)" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation "$runtime" 2>/dev/null || true)
          fi
          large=$(pick 'Pro Max$')
          [ -n "$small" ] || small=$(pick '^iPhone')
          [ -n "$large" ] || large=$(pick '^iPhone')
          test -n "$small" && test -n "$large"
          xcrun simctl list devices | grep -E "$small|$large"
          echo "small=$small" >> "$GITHUB_OUTPUT"
          echo "large=$large" >> "$GITHUB_OUTPUT"
          # Boot the small phone now so its boot time is not charged to the first test.
          xcrun simctl boot "$small" || true
          xcrun simctl bootstatus "$small" -b
      # One build for both destinations, then tests run from the built products (no rebuild).
      # Keep building past errors so one run reports every module.
      - name: Build for testing
        id: build
        continue-on-error: true
        run: |
          status=0
          xcodebuild build-for-testing \
            -project Waivera.xcodeproj -scheme Waivera \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            -IDEBuildingContinueBuildingAfterErrors=YES \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 || status=$?
          grep -E "error:|warning:" build.log | sort -u | head -300 || true
          tail -30 build.log
          exit $status
      # Package tests already ran on Linux; macOS runs only what needs a simulator. Tests run one
      # device at a time, without parallel clones (the runner has 3 cores), each step with its
      # own result bundle so a stuck step cannot take the others' results with it. xcodebuild's
      # own per-test time limit fires before the step's, so the bundle is always closed cleanly.
      # Every test's pass/fail line streams to this log as it finishes.
      #
      # Component and screen snapshots are drawn at a fixed iPhone SE width and @2x, so they run
      # on the small phone only. A missing reference is recorded and fails that test once (first
      # recording); the recorded PNGs are uploaded below.
      - name: Shell tests and snapshots (small phone)
        id: unit
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          xcodebuild test-without-building \
            -project Waivera.xcodeproj -scheme Waivera \
            -destination "id=${{ steps.sim.outputs.small }}" \
            -derivedDataPath "$DERIVED" \
            -only-testing:WaiveraTests -only-testing:WaiveraSnapshotTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 120 -maximum-test-execution-time-allowance 300 \
            -resultBundlePath Unit.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee unit.log \
            | grep --line-buffered -iE "test case .*(passed|failed|skipped)|recorded|error:|\*\* TEST"
          exit ${PIPESTATUS[0]}
      - name: UI tests, screenshot tour and accessibility audits (small phone)
        id: ui_small
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set +e
          xcodebuild test-without-building \
            -project Waivera.xcodeproj -scheme Waivera \
            -destination "id=${{ steps.sim.outputs.small }}" \
            -derivedDataPath "$DERIVED" \
            -only-testing:WaiveraUITests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 \
            -resultBundlePath UISmall.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-small.log \
            | grep --line-buffered -iE "test case .*(passed|failed|skipped)|error:|\*\* TEST"
          exit ${PIPESTATUS[0]}
      # Screenshots only: TEST_RUNNER_ variables reach the test runner without the prefix.
      - name: Screenshot tour (large phone)
        id: ui_large
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        env:
          TEST_RUNNER_WAIVERA_AUDIT: "0"
        run: |
          set +e
          xcrun simctl shutdown "${{ steps.sim.outputs.small }}" || true
          xcodebuild test-without-building \
            -project Waivera.xcodeproj -scheme Waivera \
            -destination "id=${{ steps.sim.outputs.large }}" \
            -derivedDataPath "$DERIVED" \
            -only-testing:WaiveraUITests/ScreenshotTourLight \
            -only-testing:WaiveraUITests/ScreenshotTourDark \
            -only-testing:WaiveraUITests/ScreenshotTourAccessibilityXXXL \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 900 \
            -resultBundlePath UILarge.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-large.log \
            | grep --line-buffered -iE "test case .*(passed|failed|skipped)|error:|\*\* TEST"
          exit ${PIPESTATUS[0]}
      - name: Export screenshots to PNG
        id: export
        if: always()
        continue-on-error: true
        run: |
          mkdir -p screenshots
          exported=0
          for bundle in Unit UISmall UILarge; do
            if [ ! -f "$bundle.xcresult/Info.plist" ]; then
              echo "$bundle.xcresult is missing or was not closed; nothing to export"
              continue
            fi
            out="screenshots/$bundle"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "$bundle.xcresult" --output-path "$out" || continue
            exported=1
            # Rename exported files to their attachment names (<route>__<device>-<variant>).
            if [ -f "$out/manifest.json" ]; then
              jq -r '.[] | .attachments[] | [.exportedFileName, .suggestedHumanReadableName] | @tsv' \
                "$out/manifest.json" | while IFS=$'\t' read -r file name; do
                  [ -f "$out/$file" ] && mv "$out/$file" "$out/${name}" || true
                done
            fi
            echo "$bundle: $(find "$out" -name '*.png' | wc -l | tr -d ' ') PNGs"
          done
          test "$exported" = 1
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - name: Upload recorded component snapshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: snapshots
          path: WaiveraSnapshotTests/__Snapshots__
          if-no-files-found: ignore
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            *.xcresult
            *.log
          if-no-files-found: warn
      - name: Fail if any check failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.swiftlint.outcome }}" = success ] || failed="$failed swiftlint"
          [ "${{ steps.swiftformat.outcome }}" = success ] || failed="$failed swift-format"
          [ "${{ steps.xcodegen.outcome }}" = success ] || failed="$failed xcodegen"
          [ "${{ steps.sim.outcome }}" = success ] || failed="$failed simulators"
          [ "${{ steps.build.outcome }}" = success ] || failed="$failed build"
          [ "${{ steps.unit.outcome }}" = success ] || failed="$failed shell-tests-and-snapshots"
          [ "${{ steps.ui_small.outcome }}" = success ] || failed="$failed ui-tests-small-phone"
          [ "${{ steps.ui_large.outcome }}" = success ] || failed="$failed screenshot-tour-large-phone"
          [ "${{ steps.export.outcome }}" = success ] || failed="$failed screenshot-export"
          if [ -n "$failed" ]; then echo "Failed checks:$failed"; exit 1; fi
          echo "All checks passed"
