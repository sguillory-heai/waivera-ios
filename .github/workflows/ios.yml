name: iOS

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast feedback on the Foundation-only packages without paying for a macOS runner.
  packages-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test WaiveraAPI
        run: swift test --package-path Packages/WaiveraAPI
      - name: Test WaiveraRealtime
        run: swift test --package-path Packages/WaiveraRealtime

  app-macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: |
          swiftlint --strict
          xcrun swift-format lint -r App Packages WaiveraUITests
      - name: Generate project
        run: xcodegen generate
      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[]
                      | select(.name | startswith("iPhone"))][0].udid')
          test -n "$udid" && test "$udid" != null
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild test \
            -project Waivera.xcodeproj \
            -scheme Waivera \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults.xcresult
